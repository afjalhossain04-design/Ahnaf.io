<style>
:root{
  --accent:#FF2D55;
  --accent-2:#ff5c7a;
  --bg:#0b0b0d;
  --bg-2:#111115;
  --card:#15151a;
  --line:rgba(255,255,255,.08);
  --text:#f2f2f4;
  --muted:#a1a1ac;
  --radius:14px;
  --display:'Barlow Condensed',Impact,sans-serif;
  --body:'Barlow',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{width:min(1180px,100% - 48px);margin-inline:auto}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;z-index:500;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600}
.skip:focus{left:12px}
::selection{background:var(--accent);color:#fff}

body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* progress bar */
#progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent-2));z-index:300}

/* NAV */
header{position:fixed;inset:0 0 auto 0;z-index:100;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(11,11,13,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:30px}
.nav-links a:not(.btn){font-weight:500;font-size:.95rem;color:var(--muted);transition:color .2s;position:relative}
.nav-links a:not(.btn):hover,.nav-links a.active{color:#fff}
.nav-links a:not(.btn)::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav-links a.active::after,.nav-links a:not(.btn):hover::after{transform:scaleX(1)}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);cursor:pointer;place-items:center}
.burger span{display:block;width:18px;height:2px;background:#fff;position:relative;transition:.25s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:#fff;transition:.25s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{top:0;transform:rotate(45deg)}
.burger[aria-expanded="true"] span::after{top:0;transform:rotate(-45deg)}

.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--body);font-weight:600;font-size:.95rem;padding:13px 26px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 30px -8px rgba(255,45,85,.6)}
.btn-primary:hover{background:var(--accent-2);transform:translateY(-2px)}
.btn-outline{border-color:rgba(255,255,255,.2);color:#fff;background:transparent}
.btn-outline:hover{border-color:#fff;transform:translateY(-2px)}
.btn-sm{padding:9px 20px;font-size:.88rem}

/* HERO */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding-top:68px;overflow:hidden;
  background:radial-gradient(900px 600px at 78% 55%,rgba(255,45,85,.18),transparent 60%),radial-gradient(600px 400px at 10% 90%,rgba(255,45,85,.07),transparent 60%),var(--bg)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 70% 50%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 0%,transparent 70%);opacity:.5}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;position:relative;z-index:2}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--accent)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(4rem,11vw,9.5rem);line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--accent);display:block;text-shadow:0 0 60px rgba(255,45,85,.35)}
.hero p.lead{margin-top:26px;max-width:480px;font-size:1.15rem;color:var(--muted)}
.hero-cta{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap}
.hero-meta{margin-top:44px;display:flex;gap:36px;flex-wrap:wrap}
.hero-meta strong{display:block;font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1}
.hero-meta span{font-size:.8rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px;margin-bottom:22px;margin-left:12px}
.live i{width:8px;height:8px;border-radius:50%;background:#33d17a;box-shadow:0 0 0 0 rgba(51,209,122,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(51,209,122,0)}100%{box-shadow:0 0 0 0 rgba(51,209,122,0)}}

.hero-art{position:relative;height:min(78vh,720px);display:flex;align-items:flex-end;justify-content:center}
.hero-art::before{content:"";position:absolute;inset:8% 6% 0;border-radius:28px;background:linear-gradient(160deg,rgba(255,45,85,.9),rgba(255,45,85,.15) 70%);transform:rotate(3deg)}
.hero-art::after{content:"";position:absolute;inset:8% 6% 0;border:1px solid rgba(255,255,255,.18);border-radius:28px;transform:rotate(-2deg)}
.hero-art img{position:relative;z-index:2;height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55));transition:transform .25s ease-out;animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -10px}}
.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;width:26px;height:42px;border:2px solid rgba(255,255,255,.3);border-radius:14px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--accent);animation:cue 1.6s infinite}
@keyframes cue{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(14px)}}

/* TICKER */
.ticker{border-block:1px solid var(--line);background:var(--bg-2);overflow:hidden;position:relative;z-index:2}
.ticker-track{display:flex;width:max-content;animation:tick 30s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.12em;text-transform:uppercase;padding:16px 28px;white-space:nowrap;color:var(--muted)}
.ticker span.hot{color:#fff}
.ticker span::after{content:"✦";margin-left:56px;color:var(--accent);font-size:.9rem}
@keyframes tick{to{transform:translateX(-50%)}}

/* SECTIONS */
section.block{padding:110px 0 30px;position:relative;z-index:2}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,5vw,3.8rem);line-height:.95;text-transform:uppercase}
.sec-head h2 em{font-style:normal;color:var(--accent)}
.sec-head .eyebrow{margin-bottom:12px}
.sec-link{font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap;transition:color .2s}
.sec-link:hover{color:#fff}

/* TOOLBAR */
.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}
.search input{width:100%;padding:13px 16px 13px 46px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:#fff;font:inherit;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:.85rem;cursor:pointer;transition:.2s}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* FEATURED */
.featured{display:grid;grid-template-columns:1.5fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:28px}
.player{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;overflow:hidden;border:0;display:block;width:100%;padding:0}
.player img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.player:hover img{transform:scale(1.04)}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3}
.play{position:absolute;z-index:2;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,45,85,.22);transition:transform .25s}
.player:hover .play{transform:scale(1.1)}
.play svg{width:28px;height:28px;fill:#fff;margin-left:4px}
.feat-info{padding:38px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(255,45,85,.14);color:var(--accent-2)}
.feat-info h3{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.02}
.feat-info small{color:var(--muted);font-size:.9rem}
.feat-actions{display:flex;gap:10px;flex-wrap:wrap}

/* GRID */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.vcard{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s;cursor:pointer;text-align:left;width:100%;padding:0}
.vcard:hover{transform:translateY(-6px);border-color:rgba(255,45,85,.45);box-shadow:0 24px 50px -20px rgba(0,0,0,.8)}
.vthumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.vcard:hover .vthumb img{transform:scale(1.07)}
.vthumb i{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.3s}
.vcard:hover .vthumb i,.vcard:focus-visible .vthumb i{opacity:1;transform:none}
.vthumb i svg{width:14px;height:14px;fill:#fff;margin-left:2px}
.badge{position:absolute;left:10px;top:10px;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
.badge.short{background:var(--accent)}
.vinfo{padding:16px 18px 20px}
.vtitle{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.vmeta{margin-top:10px;font-size:.82rem;color:var(--muted);display:flex;gap:10px;align-items:center}
.pin{color:var(--accent-2);font-weight:700;letter-spacing:.1em;font-size:.7rem}
.more{display:flex;justify-content:center;margin-top:34px}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.empty .btn{margin-top:18px}

.skeleton{background:linear-gradient(90deg,#15151a 25%,#1d1d24 50%,#15151a 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sk-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.sk-card .a{aspect-ratio:16/9}.sk-card .b{height:16px;margin:16px 18px 8px}.sk-card .c{height:16px;width:55%;margin:0 18px 20px}

/* CHANNELS */
.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.ch{position:relative;padding:34px 30px 30px;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px;transition:.3s;overflow:hidden}
.ch::after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,45,85,.22),transparent 70%);opacity:0;transition:opacity .3s}
.ch:hover{transform:translateY(-6px);border-color:rgba(255,45,85,.4)}
.ch:hover::after{opacity:1}
.ch .num{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;color:rgba(255,255,255,.08)}
.ch h3{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;text-transform:uppercase}
.ch .handle{color:var(--accent-2);font-weight:500;font-size:.9rem}
.ch p{color:var(--muted);font-size:.95rem;flex:1}
.ch .go{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:8px;transition:gap .2s}
.ch:hover .go{gap:14px}

/* ABOUT */
.about{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.about-card{padding:38px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.about-card h3{font-family:var(--display);font-size:1.9rem;text-transform:uppercase;line-height:1;margin-bottom:14px}
.about-card p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.stat{padding:22px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:center}
.stat strong{display:block;font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--accent-2)}
.stat span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* CTA */
.cta{margin:120px 0 0;position:relative;z-index:2}
.cta-box{position:relative;overflow:hidden;border-radius:26px;padding:70px 50px;text-align:center;background:linear-gradient(135deg,#ff2d55,#b3123a)}
.cta-box::before{content:"EDGE";position:absolute;inset:auto 0 -.28em;font-family:var(--display);font-weight:800;font-size:clamp(9rem,26vw,22rem);line-height:1;color:rgba(0,0,0,.14);letter-spacing:.02em;pointer-events:none}
.cta-box>*{position:relative}
.cta-box h2{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,6vw,4.8rem);line-height:.95;text-transform:uppercase}
.cta-box p{margin:16px auto 30px;max-width:480px;opacity:.92;font-size:1.1rem}
.cta-box .btn{background:#fff;color:#0b0b0d}
.cta-box .btn:hover{transform:translateY(-2px) scale(1.03)}

/* FOOTER */
footer{margin-top:90px;border-top:1px solid var(--line);padding:36px 0 44px;position:relative;z-index:2}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.foot .links{display:flex;gap:22px;align-items:center}
.foot .links a:hover{color:#fff}
.lock{opacity:.35;cursor:pointer;background:none;border:0;padding:6px 10px;transition:.2s}
.lock:hover{opacity:1}

/* BACK TO TOP */
#totop{position:fixed;right:20px;bottom:20px;z-index:150;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(21,21,26,.9);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:.3s}
#totop.show{opacity:1;pointer-events:auto;transform:none}
#totop:hover{background:var(--accent);border-color:var(--accent)}
#totop svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5}

/* MODAL */
#modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,5,7,.88);backdrop-filter:blur(8px)}
#modal.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal-box{position:relative;width:min(960px,100%);max-height:100%}
.modal-box.vertical{width:min(380px,100%)}
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.7)}
.modal-box.vertical .frame{aspect-ratio:9/16;max-height:82vh;margin-inline:auto}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal-title{margin-top:14px;font-weight:600;display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.modal-title a{color:var(--accent-2);white-space:nowrap;font-size:.9rem}
#modal-close{position:absolute;right:0;top:-48px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer;font-size:1.3rem;line-height:1}
#modal-close:hover{background:var(--accent);border-color:var(--accent)}

/* ADMIN */
#admin-panel{display:none;position:fixed;top:80px;right:20px;width:320px;max-width:calc(100% - 40px);z-index:250;background:#101014;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#admin-panel h4{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.ap-input{width:100%;padding:12px 14px;margin-bottom:10px;background:#18181d;border:1px solid var(--line);color:#fff;border-radius:10px;font:inherit;outline:none}
.ap-input:focus{border-color:var(--accent)}
.ap-btn{width:100%;padding:11px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:#1818
