<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gamers Edge 09 — Ahnaf Labib | Gaming Videos & Shorts</title>
<meta name="description" content="Gameplay, exploration and shorts by Ahnaf Labib across three YouTube channels.">
<meta property="og:type" content="website">
<meta property="og:title" content="Gamers Edge 09 — Ahnaf Labib">
<meta property="og:description" content="Gameplay, exploration and shorts. New drops weekly.">

<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF2D55'/%3E%3Cpath d='M24 16v32l26-16z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://img.youtube.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#FF2D55; --accent-2:#ff5c7a; --cyan:#19e3ff; --on-accent:#fff;
  --bg:#07070a; --bg-2:color-mix(in srgb,var(--bg) 92%,#fff); --card:#12121a;
  --line:rgba(255,255,255,.08); --text:#f2f2f6; --muted:#9fa0ae; --radius:10px;
  --cut:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  --display:'Barlow Condensed',Impact,sans-serif;
  --body:'Barlow',system-ui,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{width:min(1200px,100% - 48px);margin-inline:auto}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;z-index:900;background:var(--accent);color:var(--on-accent);padding:10px 16px;font-weight:600}
.skip:focus{left:12px}
::selection{background:var(--accent);color:var(--on-accent)}
.mono{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}

/* ambience */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#spot{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(500px circle at var(--mx,70%) var(--my,30%),color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%)}
body.no-scan::after,body.no-grain::before,body.no-spot #spot,body.no-xp #xp,body.no-ach #toasts,body.no-chips .chip-float,body.no-lvl #lvl{display:none}
body.no-glitch .hero h1 em::before,body.no-glitch .hero h1 em::after{display:none}
#xp{position:fixed;top:0;left:0;right:0;height:4px;z-index:300;background:rgba(255,255,255,.05)}
#xp i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--cyan));box-shadow:0 0 14px var(--accent)}

/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:100;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.scrolled{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--accent)}
.logo{width:30px;height:30px;background:var(--accent);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:grid;place-items:center;box-shadow:0 0 20px var(--accent)}
.logo svg{width:12px;height:12px;fill:var(--on-accent);margin-left:2px}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-links a:not(.btn){font-weight:500;font-size:.95rem;color:var(--muted);transition:color .2s;position:relative}
.nav-links a:not(.btn):hover,.nav-links a.active{color:#fff}
.nav-links a:not(.btn)::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav-links a.active::after,.nav-links a:not(.btn):hover::after{transform:scaleX(1)}
#lvl{font-size:.78rem;color:var(--cyan);padding:6px 10px;border:1px solid color-mix(in srgb,var(--cyan) 35%,transparent);clip-path:var(--cut);background:color-mix(in srgb,var(--cyan) 6%,transparent)}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;place-items:center}
.burger span{display:block;width:18px;height:2px;background:#fff;position:relative;transition:.25s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:#fff;transition:.25s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{top:0;transform:rotate(45deg)}
.burger[aria-expanded="true"] span::after{top:0;transform:rotate(-45deg)}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;padding:14px 30px;border:0;cursor:pointer;clip-path:var(--cut);transition:transform .2s,background .2s,filter .2s}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.btn-primary:hover{filter:drop-shadow(0 0 14px var(--accent));transform:translateY(-2px)}
.btn-primary:hover::after{left:130%}
.btn-outline{background:rgba(255,255,255,.07);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.btn-outline:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.btn-sm{padding:10px 20px;font-size:.95rem}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding-top:70px;overflow:hidden;
  background:radial-gradient(900px 600px at 78% 55%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),radial-gradient(500px 400px at 5% 95%,color-mix(in srgb,var(--cyan) 8%,transparent),transparent 60%),var(--bg)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 70% 50%,#000 0%,transparent 70%);opacity:.55}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;position:relative;z-index:2}
.status{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px;font-size:.8rem;color:var(--muted)}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#33d17a;margin-right:8px;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(51,209,122,.6)}70%{box-shadow:0 0 0 9px rgba(51,209,122,0)}100%{box-shadow:0 0 0 0 rgba(51,209,122,0)}}
.status .pill{padding:5px 12px;border:1px solid var(--line);clip-path:var(--cut);background:rgba(255,255,255,.03)}
.status .pill.hot{color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(4rem,11vw,9.5rem);line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 em{position:relative;font-style:italic;color:var(--accent);display:block;text-shadow:0 0 50px color-mix(in srgb,var(--accent) 45%,transparent)}
.hero h1 em::before,.hero h1 em::after{content:attr(data-text);position:absolute;inset:0;opacity:0;pointer-events:none}
.hero h1 em::before{color:var(--cyan);animation:gl1 6s infinite}
.hero h1 em::after{color:#fff;animation:gl2 6s infinite}
@keyframes gl1{0%,91%,100%{opacity:0}92%{opacity:.9;transform:translate(-5px,1px);clip-path:inset(15% 0 58% 0)}95%{opacity:.9;transform:translate(4px,-1px);clip-path:inset(62% 0 8% 0)}98%{opacity:0}}
@keyframes gl2{0%,92%,100%{opacity:0}93%{opacity:.6;transform:translate(4px,0);clip-path:inset(45% 0 30% 0)}96%{opacity:0}}
.hero p.lead{margin-top:26px;max-width:500px;font-size:1.15rem;color:var(--muted)}
.hero-cta{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap}
.hud{margin-top:44px;display:flex;flex-wrap:wrap;border:1px solid var(--line);width:fit-content;background:rgba(255,255,255,.02)}
.hud div{padding:14px 26px;border-right:1px solid var(--line)}
.hud div:last-child{border-right:0}
.hud strong{display:block;font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;color:#fff}
.hud span{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.hero-art{position:relative;height:min(78vh,720px);display:flex;align-items:flex-end;justify-content:center}
.hero-art::before{content:"";position:absolute;inset:8% 6% 0;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 90%,transparent),color-mix(in srgb,var(--accent) 10%,transparent) 70%);transform:rotate(3deg);clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,40px 100%,0 calc(100% - 40px))}
.hero-art .frame{position:absolute;inset:8% 6% 0;transform:rotate(-2deg);pointer-events:none;z-index:3;
  background:linear-gradient(var(--cyan),var(--cyan)) 0 0/26px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 0/2px 26px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 0/26px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 0/2px 26px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 100%/26px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 100%/2px 26px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 100%/26px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 100%/2px 26px no-repeat}
.hero-art img{position:relative;z-index:2;height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));transition:transform .25s ease-out;animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -10px}}
.chip-float{position:absolute;z-index:4;font-size:.72rem;padding:8px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);color:var(--cyan);clip-path:var(--cut);backdrop-filter:blur(6px);animation:float 5s ease-in-out infinite}
.chip-float.i0{left:0;top:18%}
.chip-float.i1{right:0;top:34%;animation-delay:-1.5s;color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.chip-float.i2{left:6%;bottom:14%;animation-delay:-3s}
.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;width:26px;height:42px;border:2px solid rgba(255,255,255,.3);border-radius:14px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--accent);animation:cue 1.6s infinite}
@keyframes cue{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(14px)}}

/* ticker */
.ticker{border-block:1px solid var(--line);background:var(--bg-2);overflow:hidden;position:relative;z-index:2}
.ticker-track{display:flex;width:max-content;animation:tick 34s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.14em;text-transform:uppercase;padding:16px 28px;white-space:nowrap;color:var(--muted)}
.ticker span.hot{color:#fff}
.ticker span::after{content:"◆";margin-left:56px;color:var(--accent);font-size:.8rem}
@keyframes tick{to{transform:translateX(-50%)}}

/* sections */
section.block{padding:110px 0 30px;position:relative;z-index:2}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,5vw,3.8rem);line-height:.95;text-transform:uppercase}
.sec-head h2 em{font-style:normal;color:var(--accent)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--accent)}
.sec-link{font-family:var(--mono);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transition:color .2s}
.sec-link:hover{color:var(--cyan)}

/* toolbar */
.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}
.search input{width:100%;padding:13px 16px 13px 46px;background:var(--card);border:1px solid var(--line);color:#fff;font:inherit;outline:none;transition:border-color .2s;clip-path:var(--cut)}
.search input:focus{border-color:var(--cyan)}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 20px;border:0;background:rgba(255,255,255,.05);color:var(--muted);font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:var(--cut);transition:.2s}
.chip:hover{color:#fff;background:rgba(255,255,255,.1)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* featured + grid */
.featured{position:relative;display:grid;grid-template-columns:1.5fr 1fr;background:var(--card);border:1px solid var(--line);overflow:hidden;margin-bottom:28px;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
.player{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;overflow:hidden;border:0;display:block;width:100%;padding:0}
.player img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.player:hover img{transform:scale(1.04)}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%)}
.play{position:absolute;z-index:2;inset:0;margin:auto;width:78px;height:78px;background:var(--accent);display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);transition:transform .25s,filter .25s}
.player:hover .play{transform:scale(1.12);filter:drop-shadow(0 0 18px var(--accent))}
.play svg{width:28px;height:28px;fill:var(--on-accent);margin-left:4px}
.feat-info{padding:38px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.tag{align-self:flex-start;font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;padding:6px 14px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-2);clip-path:var(--cut)}
.feat-info h3{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.02}
.feat-info small{color:var(--muted);font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.feat-actions{display:flex;gap:10px;flex-wrap:wrap}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.vcard{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s;cursor:pointer;text-align:left;width:100%;padding:0}
.vcard::before{content:"";position:absolute;left:0;top:0;width:34px;height:34px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);border-top-left-radius:var(--radius);z-index:3;opacity:0;transition:.3s}
.vcard:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 24px 50px -20px rgba(0,0,0,.9),0 0 30px -8px color-mix(in srgb,var(--accent) 40%,transparent)}
.vcard:hover::before{opacity:1}
.vthumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.vcard:hover .vthumb img{transform:scale(1.07)}
.vthumb i{position:absolute;right:12px;bottom:12px;width:42px;height:42px;background:var(--accent);display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);opacity:0;transform:translateY(8px);transition:.3s}
.vcard:hover .vthumb i,.vcard:focus-visible .vthumb i{opacity:1;transform:none}
.vthumb i svg{width:14px;height:14px;fill:var(--on-accent);margin-left:2px}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.badge{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
.badge.short,.badge.pinned{background:var(--accent);color:var(--on-accent)}
.badge.new{background:var(--cyan);color:#001318;font-weight:700}
.vinfo{padding:16px 18px 20px}
.vtitle{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.vmeta{margin-top:10px;font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:34px}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.empty .btn{margin-top:18px}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--card) 80%,#fff) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sk-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.sk-card .a{aspect-ratio:16/9}.sk-card .b{height:16px;margin:16px 18px 8px}.sk-card .c{height:16px;width:55%;margin:0 18px 20px}

/* channels */
.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.ch{position:relative;padding:32px 30px 28px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;transition:.3s;overflow:hidden;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.ch::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.ch:hover{transform:translateY(-6px);background:color-mix(in srgb,var(--card) 90%,#fff)}
.ch:hover::after{opacity:1}
.ch .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch .num{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;color:rgba(255,255,255,.09)}
.ch .cls{font-size:.7rem;color:var(--cyan);padding:5px 10px;border:1px solid color-mix(in srgb,var(--cyan) 35%,transparent)}
.ch h3{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;text-transform:uppercase}
.ch .handle{color:var(--accent-2);font-weight:500;font-size:.9rem}
.ch p{color:var(--muted);font-size:.95rem}
.bars{display:grid;gap:10px;margin:6px 0 8px}
.bar{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;font-size:.68rem;color:var(--muted)}
.bar i{display:block;height:6px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;width:calc(var(--v)*1%);transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--accent),var(--cyan))}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.game{position:relative;padding:22px 20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:.3s;clip-path:var(--cut)}

/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.about-card{padding:38px;background:var(--card);border:1px solid var(--line)}
.about-card h3{font-family:var(--display);font-size:1.9rem;text-transform:uppercase;line-height:1;margin-bottom:14px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-top:6px}
.stat{padding:22px 12px;background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:center}
.stat strong{display:block;font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--cyan)}
.stat span{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* cta + footer */
.cta{margin:120px 0 0;position:relative;z-index:2}
.cta-box{position:relative;overflow:hidden;padding:76px 50px;text-align:center;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,40px 100%,0 calc(100% - 40px))}
.cta-box::before{content:"EDGE";position:absolute;inset:auto 0 -.28em;font-family:var(--display);font-weight:800;font-size:clamp(9rem,26vw,22rem);line-height:1;color:rgba(0,0,0,.15);letter-spacing:.02em;pointer-events:none}
.cta-box>*{position:relative}
.cta-box .mono{font-size:.8rem;opacity:.85;margin-bottom:14px;display:block}
.cta-box h2{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,6vw,4.8rem);line-height:.95;text-transform:uppercase}
.cta-box p{margin:16px auto 30px;max-width:480px;opacity:.92;font-size:1.1rem}
.cta-box .btn{background:#fff;color:#0b0b0d}
.cta-box .btn:hover{transform:translateY(-2px) scale(1.03)}
footer{margin-top:90px;border-top:1px solid var(--line);padding:36px 0 44px;position:relative;z-index:2}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.foot .links{display:flex;gap:22px;align-items:center;flex-wrap:wrap}

.lock{opacity:.3;cursor:pointer;background:none;border:0;padding:6px 10px;transition:.2s}
.lock:hover{opacity:1}
#totop{position:fixed;right:20px;bottom:20px;z-index:150;width:48px;height:48px;border:0;background:var(--accent);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:.3s}
#totop.show{opacity:1;pointer-events:auto;transform:none}
#totop svg{width:18px;height:18px;fill:none;stroke:var(--on-accent);stroke-width:2.5}

/* toast + modal */
#toasts{position:fixed;left:20px;bottom:20px;z-index:350;display:grid;gap:10px;pointer-events:none}
.toast{display:flex;gap:14px;align-items:center;min-width:250px;padding:14px 18px;background:color-mix(in srgb,var(--bg) 94%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);clip-path:var(--cut);animation:toast 5s forwards}
.toast b{display:block;font-family:var(--display);font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase}

.toast .ico{font-size:1.5rem}
.toast .mono{font-size:.66rem;color:var(--cyan)}
@keyframes toast{0%{opacity:0;transform:translateX(-30px)}8%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-30px)}}
#modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,4,6,.9);backdrop-filter:blur(8px)}

@keyframes fade{from{opacity:0}}
.modal-box{position:relative;width:min(960px,100%);max-height:100%}
.modal-box.vertical{width:min(380px,100%)}
.mframe{position:relative;aspect-ratio:16/9;background:#000;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 50%,transparent),0 40px 100px rgba(0,0,0,.8),0 0 60px -10px color-mix(in srgb,var(--accent) 45%,transparent)}
.modal-box.vertical .mframe{aspect-ratio:9/16;max-height:82vh;margin-inline:auto}
.mframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal-title{margin-top:14px;font-weight:600;display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.modal-title a{color:var(--accent-2);white-space:nowrap;font-size:.9rem}

#modal-close:hover{background:var(--accent);border-color:var(--accent)}

async function sha256(s){
  if (!(window.crypto && crypto.subtle)) return null;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

  if (sessionStorage.getItem('ge_unlocked') === '1') return openDrawer();
  const p = prompt('Access key:'); if (!p) return;
  const h = await sha256(p.trim());
  if (h === null) return alert('Admin needs HTTPS or localhost (this browser blocks hashing on insecure pages).');
  if (h !== CONFIG.adminHash) return alert('Wrong key.');
  sessionStorage.setItem('ge_unlocked', '1'); fab.classList.add('show');
  const d = safeGet('ge_draft');
  if (d && d !== JSON.stringify(CONFIG) && d !== SAVED && confirm('Found unsaved local edits from earlier. Load them?')){ CONFIG = JSON.parse(d); applyAll(); renderVideos(); }
  openDrawer();
}

/* ---- live editing ---- */
function onChange(p){
  const m = /^videos\.pinned\.(\d+)\.url$/.exec(p);
  if (m){ const it = CONFIG.videos.pinned[+m[1]]; it.id = getId(it.url) || it.id; }
  applyAll();
  if (p.startsWith('videos') || p.startsWith('sections')) renderVideos();
  scheduleSave();
}
body.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.g){
    const k = el.dataset.g;
    if (k === 'token') setTok(el.value.trim()); else GH[k] = el.type === 'checkbox' ? el.checked : el.value.trim();
    if (k === 'remember') setTok(getTok() || safeGet('ge_tok') || ''); saveGH(); return;
  }
  const p = el.dataset.p; if (!p) return;
  const v = el.type === 'checkbox' ? el.checked : (el.type === 'number' || el.type === 'range') ? Number(el.value) : el.value;
  set(p, v); onChange(p);
  if (el.type === 'range'){ const lab = el.closest('.f').querySelector('label b'); if (lab) lab.textContent = v; }
});
body.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.p === 'videos.channelId'){ FEED = []; loadFeed(); }
  if (el.id === 'hero-file' && el.files[0]) uploadHero(el.files[0]);
  if (el.id === 'import-file' && el.files[0]) importFile(el.files[0]);
});
body.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, p = b.dataset.p, i = Number(b.dataset.i);
  if (act === 'add' || act === 'del' || act === 'up' || act === 'down'){
    const arr = get(p); if (!Array.isArray(arr)) return;
    if (act === 'add'){ if (p === 'videos.pinned') return setStatus('Use the form above to pin a video', 'err'); arr.push(clone(TEMPLATES[p.split('.').pop()])); }
    if (act === 'del') arr.splice(i, 1);
    if (act === 'up' && i > 0) [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
    if (act === 'down' && i < arr.length - 1) [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
    renderTab(); onChange(p); return;
  }
  if (act === 'pin-add'){
    const url = $('#pin-url').value.trim(), title = $('#pin-title').value.trim(), id = getId(url);
    if (!id || !title) return setStatus('Enter a valid YouTube URL and a title', 'err');
    CONFIG.videos.pinned.unshift({id, url, title, ts:Date.now()}); renderTab(); onChange('videos.pinned'); return;
  }
  if (act === 'preset'){ const pr = PRESETS[i]; Object.assign(CONFIG.theme, {accent:pr.accent, accent2:pr.accent2, cyan:pr.cyan}); renderTab(); onChange('theme'); return; }
  if (act === 'gh-test') return testGH();
  if (act === 'gh-save') return pushToGitHub();
  if (act === 'export'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(CONFIG, null, 2)], {type:'application/json'})); a.download = 'gamers-edge-settings.json'; a.click(); return; }
  if (act === 'copy'){ try { await navigator.clipboard.writeText(JSON.stringify(CONFIG, null, 2)); setStatus('Settings copied', 'ok'); } catch(err){ setStatus('Copy blocked by browser', 'err'); } return; }
  if (act === 'discard'){ if (!confirm('Throw away all unsaved changes?')) return; CONFIG = JSON.parse(SAVED); safeSet('ge_draft', ''); applyAll(); renderVideos(); renderTab(); setStatus('Reverted to last saved', 'ok'); return; }
  if (act === 'key'){
    const k = $('#new-key').value.trim(); if (k.length < 6) return setStatus('Key must be 6+ characters', 'err');
    const h = await sha256(k); if (!h) return setStatus('Needs HTTPS to hash the key', 'err');
    CONFIG.adminHash = h; $('#new-key').value = ''; scheduleSave(); setStatus('Key changed — saving…', 'busy'); return;
  }
  if (act === 'lock'){ sessionStorage.removeItem('ge_unlocked'); drawer.classList.remove('open'); fab.classList.remove('show'); }
});
function importFile(file){
  const r = new FileReader();
  r.onload = () => { try { const c = JSON.parse(r.result); if (!c.site || !c.theme) throw 0; CONFIG = c; applyAll(); renderVideos(); loadFeed(); renderTab(); scheduleSave(); } catch(e){ setStatus('Not a valid settings file', 'err'); } };
  r.readAsText(file);
}

/* ---- GitHub commit ---- */
const b64enc = s => { const bytes = new TextEncoder().encode(s); let bin = ''; bytes.forEach(c => bin += String.fromCharCode(c)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const buf2b64 = buf => { const u = new Uint8Array(buf); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
async function gh(method, url, payload){
  const tok = getTok(); if (!tok) throw Object.assign(new Error('Add a GitHub token in the GitHub tab first'), {status:0});
  if (!GH.owner || !GH.repo) throw Object.assign(new Error('Set owner and repository in the GitHub tab'), {status:0});
  const r = await fetch('https://api.github.com' + url, {method, headers:{'Authorization':'Bearer ' + tok, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(payload ? {'Content-Type':'application/json'} : {})}, body: payload ? JSON.stringify(payload) : undefined});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.message || ('HTTP ' + r.status)), {status:r.status});
  return data;
}
const fileUrl = path => `/repos/${GH.owner}/${GH.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
function injectConfig(html){
  const re = /(<script id="site-config" type="application\/json">)([\s\S]*?)(<\/script>)/;
  if (!re.test(html)) return null;
  const json = JSON.stringify(CONFIG, null, 2).replace(/</g, '\\u003c');
  return html.replace(re, (m, a, _x, c) => a + '\n' + json + '\n' + c);
}
async function testGH(){
  setStatus('Testing connection…', 'busy');
  try {
    const r = await gh('GET', `/repos/${GH.owner}/${GH.repo}`);
    const f = await gh('GET', fileUrl(GH.path) + `?ref=${encodeURIComponent(GH.branch)}`);
    const ok = r.permissions && r.permissions.push;
    setStatus(ok ? `Connected to ${r.full_name} · ${f.path} found · write access OK` : `Connected, but token has NO write access to ${r.full_name}`, ok ? 'ok' : 'err');
  } catch(e){ setStatus('Test failed: ' + e.message, 'err'); }
}
async function pushToGitHub(){
  clearTimeout(saveTimer);
  if (saving){ queued = true; return; }
  saving = true; setStatus('Committing to GitHub…', 'busy');
  try {
    for (let attempt = 0; attempt < 2; attempt++){
      const file = await gh('GET', fileUrl(GH.path) + `?ref=${encodeURIComponent(GH.branch)}`);
      const next = injectConfig(b64dec(file.content));
      if (!next) throw new Error(`"${GH.path}" in the repo has no site-config block. Upload this page to the repo first.`);
      try {
        await gh('PUT', fileUrl(GH.path), {message:'Update site settings via admin panel', content:b64enc(next), sha:file.sha, branch:GH.branch});
        SAVED = JSON.stringify(CONFIG); safeSet('ge_draft', '');
        setStatus('Saved to GitHub ✓ ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' · live in ~1 min', 'ok');
        break;
      } catch(e){ if (e.status === 409 && attempt === 0) continue; throw e; }
    }
  } catch(e){
    const hint = e.status === 401 ? 'Token invalid or expired' : e.status === 403 || e.status === 404 ? 'No access — check token scope, repo name, path' : e.message;
    setStatus('GitHub error: ' + hint, 'err');
  } finally { saving = false; if (queued){ queued = false; pushToGitHub(); } }
}
async function uploadHero(file){
  if (file.size > 5 * 1024 * 1024) return setStatus('Image is over 5 MB', 'err');
  setStatus('Uploading image…', 'busy');
  try {
    const name = 'assets/hero-' + Date.now() + '.' + (file.name.split('.').pop() || 'png').toLowerCase();
    await gh('PUT', fileUrl(name), {message:'Upload hero image via admin panel', content:buf2b64(await file.arrayBuffer()), branch:GH.branch});
    heroPreview = URL.createObjectURL(file); set('site.heroImage', name); renderTab(); onChange('site.heroImage');
  } catch(e){ setStatus('Upload failed: ' + e.message, 'err'); }
}
function scheduleSave(){
  safeSet('ge_draft', JSON.stringify(CONFIG));
  clearTimeout(saveTimer);
  if (GH.autosave && getTok()){ setStatus('Unsaved changes — auto-saving…', 'busy'); saveTimer = setTimeout(pushToGitHub, 2500); }
  else setStatus(getTok() ? 'Unsaved — click Save now' : 'Saved in this browser only — add a GitHub token to publish', 'err');
}
$('#dr-save').addEventListener('click', () => { if (getTok()) pushToGitHub(); else { setStatus('Add a GitHub token first (GitHub tab)', 'err'); tab = 'github'; renderTabs(); renderTab(); } });
addEventListener('beforeunload', e => { if (saveTimer || saving){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
applyAll();
shown = CONFIG.videos.pageSize || 9;
onScroll();
booted = true;
loadFeed();
